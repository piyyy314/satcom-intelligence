  <style>
    :root {
      --cyan-primary: #22d3ee;
      --amber-alert: #fbbf24;
      --red-critical: #ef4444;
      --slate-bg: #020617;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--slate-bg);
      background-image: 
        linear-gradient(rgba(34, 211, 238, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      color: #f1f5f9;
      overflow-x: hidden;
      transition: background-color 0.5s ease-in-out, background-image 0.5s ease-in-out;
      letter-spacing: -0.01em;
    }
    .stealth-active {
      background-color: #000000;
      background-image: 
        linear-gradient(rgba(100, 200, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 200, 255, 0.02) 1px, transparent 1px);
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .glass {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 40px -15px rgba(0,0,0,0.7);
    }

    .tactical-glow {
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.3), inset 0 0 10px rgba(34, 211, 238, 0.1);
    }

    .btn-scanline {
      position: relative;
      overflow: hidden;
    }
    .btn-scanline::after {
      content: "";
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, transparent, rgba(34, 211, 238, 0.2), transparent);
      animation: btn-scan 2s linear infinite;
    }
    @keyframes btn-scan {
      from { top: -100%; }
      to { top: 100%; }
    }

    .crt-screen { position: relative; }

    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 2px, 2px 100%;
      pointer-events: none;
      z-index: 1000;
      opacity: 0.25;
    }

    .crt-vignette {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
      z-index: 1001;
    }

    .crt-flicker {
      animation: flicker 0.2s infinite;
      position: fixed;
      inset: 0;
      background: rgba(18, 16, 16, 0.01);
      pointer-events: none;
      z-index: 1002;
    }

    @keyframes flicker {
      0% { opacity: 0.1; }
      50% { opacity: 0.15; }
      100% { opacity: 0.1; }
    }

    .crt-distorted {
      animation: screen-shake 0.3s infinite;
      filter: contrast(1.15) brightness(1.05) saturate(1.3) hue-rotate(-1deg);
    }

    @keyframes screen-shake {
      0% { transform: translate(0,0); }
      33% { transform: translate(0.5px, 0.5px); }
      66% { transform: translate(-0.5px, -0.5px); }
      100% { transform: translate(0,0); }
    }

    .scanline {
      width: 100%;
      height: 12px;
      background: linear-gradient(to bottom, transparent, rgba(34, 211, 238, 0.05), transparent);
      position: absolute;
      top: 0;
      animation: scan 8s linear infinite;
      z-index: 1003;
      pointer-events: none;
    }

    @keyframes scan {
      from { transform: translateY(-100%); }
      to { transform: translateY(1000%); }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    .defcon-alert {
      animation: alert-flash 1.5s step-end infinite;
    }
    @keyframes alert-flash {
      50% { background-color: rgba(239, 68, 68, 0.05); border-color: rgba(239, 68, 68, 0.4); }
    }

    .status-pulse {
      animation: status-pulse 2s infinite;
    }
    @keyframes status-pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(34, 211, 238, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
    }
    
    .card-header-line {
      height: 1px;
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.5), transparent);
      width: 100%;
      margin-top: 4px;
    }
  </style>
