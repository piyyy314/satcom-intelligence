name: Feature Request
description: Propose a new feature, satellite model, or protocol enhancement
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Tactical SatCom Intelligence even more capable in the field? Let us know!
  - type: textarea
    id: problem-statement
    attributes:
      label: Is your feature request related to a problem or tactical operational need?
      description: A clear and concise description of the operational requirement.
      placeholder: As a field VSAT engineer, I need to...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Describe the solution you'd like
      description: A detailed description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative tactical solutions or features you've evaluated.
