name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build
        run: |
          npm run typecheck
          npm run build

      - name: Package Dist Artifact
        run: |
          cd dist
          tar -czvf ../satexpert-tsi-bundle-${{ github.ref_name }}.tar.gz .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: satexpert-tsi-bundle-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
